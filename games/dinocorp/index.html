<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DinoCorp: Misión Salida a Tiempo (v4.2 Deluxe Edition)</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --panel-bg: #1e293b;
      --accent-gold: #fbbf24;
      --accent-green: #22c55e;
      --accent-blue: #38bdf8;
      --accent-red: #ef4444;
      --text-light: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text-light);
      display: flex;
      flex-direction: column;
    }

    /* Barra Superior de Control, Selector de Mundos y Herramientas v4.0 */
    #top-bar {
      min-height: 44px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 10px;
      font-size: 12px;
      flex-wrap: wrap;
      gap: 6px;
      z-index: 30;
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-weight: 900;
      color: var(--accent-gold);
      font-size: 13.5px;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .badge-deluxe {
      background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
      color: #fff;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .level-selector {
      display: flex;
      gap: 3px;
      background: #090d16;
      padding: 3px;
      border-radius: 6px;
      border: 1px solid #334155;
    }

    .btn-lvl {
      background: transparent;
      color: #94a3b8;
      border: none;
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-lvl:hover {
      color: #fff;
      background: #1e293b;
    }

    .btn-lvl.active {
      background: var(--accent-gold);
      color: #090d16;
    }

    .top-actions {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-top {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .btn-top:hover {
      background: #334155;
      border-color: var(--accent-gold);
    }

    .btn-top.active-mode {
      background: rgba(56, 189, 248, 0.22);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    /* Contenedor General (Soporta Vista Completa y Simulador Móvil 390px) */
    #viewport-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
    }

    #app-workspace {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: width 0.25s ease, height 0.25s ease;
    }

    /* Marco de Simulación Móvil en Escritorio (390x780) */
    #app-workspace.simulated-mobile-frame {
      width: 390px;
      height: min(760px, 95%);
      border: 10px solid #1e293b;
      border-radius: 32px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 0 2px #475569;
      background: #0f172a;
    }

    #stage-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      padding: 4px;
    }

    canvas {
      display: block;
      background: #38bdf8;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.75);
      border: 2px solid #334155;
      border-radius: 8px;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 16 / 9;
      image-rendering: pixelated;
      outline: none;
    }

    /* Controles Táctiles Bimodales con 5 Botones (Izq, Der, Dash, Sello, Salto) */
    #touch-layer {
      display: none;
      width: 100%;
      z-index: 15;
    }

    body.touch-enabled #touch-layer,
    #app-workspace.simulated-mobile-frame #touch-layer {
      display: flex;
    }

    @media (orientation: landscape) {
      body.touch-enabled #app-workspace:not(.simulated-mobile-frame) #touch-layer {
        position: absolute;
        bottom: 12px;
        left: 0;
        right: 0;
        padding: 0 18px;
        justify-content: space-between;
        align-items: flex-end;
        pointer-events: none;
      }
    }

    @media (orientation: portrait) {
      body.touch-enabled #stage-container {
        flex: 0 0 58%;
      }
      body.touch-enabled #touch-layer {
        flex: 1;
        background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
        border-top: 2px solid #334155;
        padding: 12px 14px;
        justify-content: space-between;
        align-items: center;
      }
    }

    /* Reglas equivalentes para el Simulador Móvil en Escritorio */
    #app-workspace.simulated-mobile-frame #stage-container {
      flex: 0 0 56%;
      padding: 6px;
    }
    #app-workspace.simulated-mobile-frame #touch-layer {
      flex: 1;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      border-top: 2px solid #334155;
      padding: 10px 12px;
      justify-content: space-between;
      align-items: center;
    }

    .touch-cluster {
      display: flex;
      gap: 10px;
      pointer-events: auto;
      touch-action: none;
      align-items: center;
    }

    .touch-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.85);
      border: 2.5px solid rgba(255, 255, 255, 0.45);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 17px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      transition: transform 0.05s, background 0.1s;
    }

    .touch-btn span {
      font-size: 8.5px;
      font-weight: 800;
      margin-top: 1px;
      opacity: 0.92;
      letter-spacing: 0.3px;
    }

    .touch-btn.btn-dash {
      background: rgba(14, 165, 233, 0.85);
      border-color: #7dd3fc;
      width: 56px;
      height: 56px;
    }

    .touch-btn.btn-stamp {
      background: rgba(34, 197, 94, 0.85);
      border-color: #86efac;
      width: 60px;
      height: 60px;
    }

    .touch-btn.btn-jump {
      background: rgba(239, 68, 68, 0.88);
      border-color: #fca5a5;
      width: 68px;
      height: 68px;
    }

    .touch-btn.active {
      transform: scale(0.90);
      background: rgba(251, 191, 36, 0.96);
      color: #0f172a;
      border-color: #fff;
    }

    /* Ventanas Modales */
    .overlay-modal {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 40;
    }

    .overlay-modal.visible {
      display: flex;
    }

    .modal-card {
      background: #1e293b;
      border: 2px solid var(--accent-gold);
      border-radius: 14px;
      max-width: 490px;
      width: 100%;
      max-height: 92%;
      overflow-y: auto;
      padding: 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.88);
    }

    .modal-card h2 {
      color: var(--accent-gold);
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .modal-card p {
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .stats-grid {
      background: #0f172a;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      text-align: left;
      font-size: 12px;
      border: 1px solid #334155;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      padding: 4.5px 0;
      border-bottom: 1px dashed #334155;
    }

    .stats-row:last-child {
      border-bottom: none;
      font-weight: 800;
      color: var(--accent-gold);
      font-size: 14px;
      padding-top: 7px;
    }

    .btn-primary {
      background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
      color: #052e16;
      border: none;
      border-radius: 8px;
      padding: 11px 20px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
      box-shadow: 0 3px 0 #14532d;
    }

    .btn-primary:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #14532d;
    }

    .code-area {
      width: 100%;
      height: 130px;
      background: #090d16;
      color: #38bdf8;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      font-family: monospace;
      font-size: 11px;
      resize: none;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <!-- Barra de Control y Selector de los 4 Mundos -->
  <header id="top-bar">
    <div class="brand-group">
      <a href="../../index.html" class="btn-top" style="text-decoration:none;" title="Volver a la portada">← Portada</a>

      <!-- Controles Táctiles Multi-Touch con Dash Ejecutivo -->
      <div id="touch-layer">

          <div class="touch-btn" data-action="right">▶<span>DER</span></div>

        <div class="touch-cluster">
          <div class="touch-btn btn-dash" data-action="dash">⚡<span>DASH</span></div>
          <div class="touch-btn btn-stamp" data-action="stamp">★<span>SELLO</span></div>
          <div class="touch-btn btn-jump" data-action="jump">▲<span>SALTO</span></div>
        </div>
      </div>
    </main>
  </div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const stageContainer = document.getElementById('stage-container');
  const W = 800;
  const H = 450;
  const GROUND_Y = 390;

  // Ajuste responsivo automático mantendo proporción 16:9 exacta
  function fitCanvas() {
    const rect = stageContainer.getBoundingClientRect();
    const availW = Math.max(200, rect.width - 8);
    const availH = Math.max(120, rect.height - 8);
    const ratio = W / H;
    let dw = availW;
    let dh = availW / ratio;
    if (dh > availH) {
      dh = availH;
      dw = availH * ratio;
    }
    canvas.style.width = `${Math.floor(dw)}px`;
    canvas.style.height = `${Math.floor(dh)}px`;
  }
  window.addEventListener('resize', fitCanvas);
  if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(stageContainer);

  // Auto-detección de pantalla táctil
  if (('ontouchstart' in window) || (navigator.maxTouchPoints > 0)) {
    document.body.classList.add('touch-enabled');
  }

  // ==========================================
  // 1. PERSISTENCIA EN LOCALSTORAGE (RÉCORDS Y CARPETAS)
  // ==========================================
  const SAVE_KEY = 'dinocorp_v4_deluxe_save';
  const ACH_KEY = 'arcade_hub_achievements';
  let saveData = {
    highScore: 0,
    bestTimeRemaining: 0,
    foldersPerLevel: { 0: 0, 1: 0, 2: 0, 3: 0 },
    medalsPerLevel: { 0: '', 1: '', 2: '', 3: '' },
    bestTimePerLevel: { 0: 0, 1: 0, 2: 0, 3: 0 }
  };

  function unlockAchievement(id) {
    try {
      const current = JSON.parse(localStorage.getItem(ACH_KEY) || '{}');
      if (!current[id]) {
        current[id] = Date.now();
        localStorage.setItem(ACH_KEY, JSON.stringify(current));
      }
    } catch (e) {}
  }

  function loadRecords() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        saveData.highScore = parsed.highScore || 0;
        saveData.bestTimeRemaining = parsed.bestTimeRemaining || 0;
        if (parsed.foldersPerLevel) {
          saveData.foldersPerLevel = { ...saveData.foldersPerLevel, ...parsed.foldersPerLevel };
        }
        if (parsed.medalsPerLevel) {
          saveData.medalsPerLevel = { ...saveData.medalsPerLevel, ...parsed.medalsPerLevel };
        }
        if (parsed.bestTimePerLevel) {
          saveData.bestTimePerLevel = { ...saveData.bestTimePerLevel, ...parsed.bestTimePerLevel };
        }
      }
    } catch (e) {}
  }

  function medalRank(m) {
    return m === '🥇' ? 3 : (m === '🥈' ? 2 : (m === '🥉' ? 1 : 0));
  }

  function awardLevelMedal(levelIdx, foldersCount, remSecs) {
    const earned = (foldersCount >= 3 && remSecs >= 60) ? '🥇' : ((foldersCount >= 2 || remSecs >= 45) ? '🥈' : '🥉');
    if (medalRank(earned) > medalRank(saveData.medalsPerLevel[levelIdx] || '')) {
      saveData.medalsPerLevel[levelIdx] = earned;
    }
    if (remSecs > (saveData.bestTimePerLevel[levelIdx] || 0)) {
      saveData.bestTimePerLevel[levelIdx] = remSecs;
    }
    saveRecords(score, levelIdx, foldersCount, remSecs);
    syncLevelTabs();
    return earned;
  }

  function saveRecords(currentScore, levelIdx, collectedFoldersCount, timeRemaining = null) {
    try {
      if (currentScore > saveData.highScore) saveData.highScore = currentScore;
      if (collectedFoldersCount > (saveData.foldersPerLevel[levelIdx] || 0)) {
        saveData.foldersPerLevel[levelIdx] = collectedFoldersCount;
      }
      if (timeRemaining !== null && timeRemaining > saveData.bestTimeRemaining) {
        saveData.bestTimeRemaining = timeRemaining;
      }
      localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
    } catch (e) {}
  }

  function getTotalSavedFolders() {
    return Object.values(saveData.foldersPerLevel).reduce((a, b) => a + b, 0);
  }

  loadRecords();

  // ==========================================
  // 2. MOTOR DE AUDIO Y SECUENCIADOR CHIPTUNE 8-BITS
  // ==========================================
  const AUDIO_PREFS_KEY = 'dinocorp_audio_prefs';
  let audioCtx = null;
  let sfxMuted = false;
  let musicEnabled = true;

  function loadAudioPrefs() {
    try {
      const raw = JSON.parse(localStorage.getItem(AUDIO_PREFS_KEY) || '{}');
      if (typeof raw.sfxMuted === 'boolean') sfxMuted = raw.sfxMuted;
      if (typeof raw.musicEnabled === 'boolean') musicEnabled = raw.musicEnabled;
    } catch (e) {}
    const mBtn = document.getElementById('btn-music');
    const sBtn = document.getElementById('btn-mute');
    if (mBtn) {
      mBtn.textContent = musicEnabled ? '🎵 Música' : '🎵 Off';
      mBtn.classList.toggle('active-mode', musicEnabled);
    }
    if (sBtn) {
      sBtn.textContent = sfxMuted ? '🔇 SFX Off' : '🔊 SFX';
      sBtn.classList.toggle('active-mode', !sfxMuted);
    }
  }

  function saveAudioPrefs() {
    try {
      localStorage.setItem(AUDIO_PREFS_KEY, JSON.stringify({ sfxMuted, musicEnabled }));
    } catch (e) {}
  }

  loadAudioPrefs();

  function initAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTone(freq, type, duration, vol = 0.1, slideFreq = null) {
    if (sfxMuted || !audioCtx || freq <= 0) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideFreq) osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function playMusicNote(freq, type, duration, vol = 0.04) {
    if (!musicEnabled || !audioCtx || freq <= 0) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0008, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  const SFX = {
    jump: () => playTone(240, 'square', 0.15, 0.09, 580),
    dash: () => playTone(620, 'sawtooth', 0.12, 0.09, 180),
    dashReady: () => {
      playTone(880, 'triangle', 0.06, 0.05);
      setTimeout(() => playTone(1174, 'triangle', 0.08, 0.05), 45);
    },
    skid: () => playTone(190, 'triangle', 0.06, 0.06, 120),
    stomp: () => playTone(170, 'triangle', 0.14, 0.14, 70),
    kick: () => playTone(130, 'sawtooth', 0.17, 0.14, 420),
    clink: () => {
      playTone(960, 'square', 0.05, 0.1, 1280);
      setTimeout(() => playTone(1400, 'square', 0.07, 0.08, 920), 40);
    },
    coin: () => {
      playTone(987, 'square', 0.07, 0.09);
      setTimeout(() => playTone(1318, 'square', 0.2, 0.09), 65);
    },
    folder: () => {
      [587, 784, 987, 1174].forEach((f, i) => setTimeout(() => playTone(f, 'square', 0.1, 0.1), i * 55));
    },
    powerup: () => {
      [330, 392, 659, 523, 587, 784].forEach((f, i) => setTimeout(() => playTone(f, 'square', 0.08, 0.1), i * 50));
    },
    energy: () => {
      [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => playTone(f, 'sawtooth', 0.09, 0.1), i * 45));
    },
    stamp: () => playTone(500, 'triangle', 0.11, 0.1, 210),
    emptyInk: () => playTone(130, 'sawtooth', 0.09, 0.08, 95),
    hurt: () => playTone(260, 'sawtooth', 0.25, 0.13, 85),
    warp: () => {

  function updateTouches(e) {
    e.preventDefault();
    initAudio();
    const prevJ = touchState.jump;
    const prevS = touchState.stamp;
    const prevD = touchState.dash;
    touchState.left = touchState.right = touchState.jump = touchState.stamp = touchState.dash = false;

    for (let i = 0; i < e.touches.length; i++) {
      const t = e.touches[i];
      for (const btn of touchButtons) {
        const r = btn.getBoundingClientRect();
        if (t.clientX >= r.left - 8 && t.clientX <= r.right + 8 && t.clientY >= r.top - 8 && t.clientY <= r.bottom + 8) {
          touchState[btn.dataset.action] = true;
        }
      }
    }
    if (touchState.jump && !prevJ) jumpJustPressed = true;
    if (touchState.stamp && !prevS) stampJustPressed = true;
    if (touchState.dash && !prevD) dashJustPressed = true;
    touchButtons.forEach(btn => btn.classList.toggle('active', touchState[btn.dataset.action]));
  }

    const gp = pads && (pads[0] || pads[1] || pads[2] || pads[3]);
    if (!gp) return;

    const prevJ = padState.jump;
    const prevS = padState.stamp;
    const prevD = padState.dash;

    const axisX = gp.axes && gp.axes.length > 0 ? gp.axes[0] : 0;
    const dpadLeft = gp.buttons[14] && gp.buttons[14].pressed;
    const dpadRight = gp.buttons[15] && gp.buttons[15].pressed;

    padState.left = axisX < -0.35 || dpadLeft;
    padState.right = axisX > 0.35 || dpadRight;
    padState.jump = Boolean((gp.buttons[0] && gp.buttons[0].pressed) || (gp.buttons[12] && gp.buttons[12].pressed));
    padState.stamp = Boolean(gp.buttons[2] && gp.buttons[2].pressed);
    padState.dash = Boolean((gp.buttons[1] && gp.buttons[1].pressed) || (gp.buttons[5] && gp.buttons[5].pressed));

    if (padState.jump && !prevJ) jumpJustPressed = true;
    if (padState.stamp && !prevS) stampJustPressed = true;
    if (padState.dash && !prevD) dashJustPressed = true;
  }

        { type: 'printer', x: 2860, y: GROUND_Y - 38, w: 40, h: 38, vx: -1.5, vy: 0, state: 'walk', alive: true },

      for (let bx = 3600; bx < 3960; bx += 30) {

      }

        shielded: true, vulnerableTimer: 0, hurtCooldown: 0, actionTimer: 90,

      };

    cameraX = Math.max(0, dino.x - 200);
  }

  // ==========================================
  // 6. FÍSICAS PRO (COYOTE TIME, JUMP BUFFER, SQUASH & STRETCH, DASH)
  // ==========================================
  function rectIntersect(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function hurtDino(reasonText = '¡TRÁMITE PENDIENTE!') {
    if (dino.invincibleTimer > 0 || dino.invulnerable > 0 || gameState !== 'PLAYING') return;
    triggerScreenShake(16, 6);

    if (dino.senior) {
      dino.senior = false;
      dino.invulnerable = 95;
      SFX.hurt();
      addFloatingText('¡PERDISTE EL SACO SENIOR!', dino.x - 10, dino.y - 15, '#f87171');
      addParticles(dino.x + dino.w / 2, dino.y + dino.h / 2, '#1e293b', 12);
    } else {
      lives--;
      SFX.hurt();
      addFloatingText(reasonText, dino.x - 10, dino.y - 20, '#ef4444');
      saveRecords(score, currentLevelIdx, foldersCollectedInLevel);
      if (lives <= 0) {
        showModal(
          '¡ATRAPADO EN HORAS EXTRAS!',
          `Agotaste tus vidas en el nivel ${LEVELS[currentLevelIdx].id} (${LEVELS[currentLevelIdx].name}).`,
          'REINTENTAR DESDE 1-1',
          () => buildLevel(true, true)
        );
      } else {
        buildLevel(false, false);
      }
    }
  }

  let planeSpawnTimer = 0;

  function update(dt) {
    pollGamepad();
    updateChiptuneSequencer(dt);

    if (gameState === 'PAUSED' || gameState === 'VICTORY') return;
    if (gameState === 'WARPING') {
      dino.y += 2.2 * dt;
      warpSeq.timer -= dt;
      if (warpSeq.timer <= 0) {
        currentLevelIdx = warpSeq.targetLvl;
        gameState = 'PLAYING';
        buildLevel(false, true);
      }
      return;
    }
    if (gameState === 'ENDING') {
      updateEndingSequence(dt);
      return;
    }

    const lvl = LEVELS[currentLevelIdx];

    for (const ap of ambientParticles) {
      ap.x += ap.vx * dt;
      ap.y += ap.vy * dt;
      if (ap.x < 0) ap.x = W;
      if (ap.y < 20) ap.y = GROUND_Y - 20;
      if (ap.y > GROUND_Y - 15) ap.y = 25;
    }

    // 1. Reloj de Jornada y Temporizadores Pro
    workdayTimer += (dt / 60);
    if (workdayTimer >= MAX_WORKDAY_SECS) {
      hurtDino('¡TIEMPO AGOTADO (6:00 PM)!');
      return;
    }

    if (shakeTimer > 0) shakeTimer = Math.max(0, shakeTimer - dt);
    if (dino.invulnerable > 0) dino.invulnerable = Math.max(0, dino.invulnerable - dt);
    if (dino.invincibleTimer > 0) dino.invincibleTimer = Math.max(0, dino.invincibleTimer - dt);
    const prevDashCd = dino.dashCooldown;
    if (dino.dashCooldown > 0) dino.dashCooldown = Math.max(0, dino.dashCooldown - dt);
    if (prevDashCd > 0 && dino.dashCooldown === 0) {
      dino.dashFlashTimer = 18;
      SFX.dashReady();
    }
    if (dino.dashFlashTimer > 0) dino.dashFlashTimer = Math.max(0, dino.dashFlashTimer - dt);
    if (dino.jawOpenTimer > 0) dino.jawOpenTimer = Math.max(0, dino.jawOpenTimer - dt);

    // Recuperación elástica de Squash & Stretch hacia 1.0
    dino.scaleX += (1 - dino.scaleX) * 0.22 * dt;
    dino.scaleY += (1 - dino.scaleY) * 0.22 * dt;

    if (dino.ink < dino.maxInk) {
      dino.inkRegenTimer += dt;
      if (dino.inkRegenTimer >= 150) {
        dino.ink++;
        dino.inkRegenTimer = 0;
      }
    }

    // 2. Habilidad: DASH EJECUTIVO (Tecla C / Z / Botón ⚡ DASH)
    if (dashJustPressed && dino.dashCooldown <= 0 && dino.dashTimer <= 0) {
      dino.dashTimer = 11;
      dino.dashCooldown = 42;
      dino.jawOpenTimer = 14;
      dino.scaleX = 1.34;
      dino.scaleY = 0.78;
      SFX.dash();
      addParticles(dino.x + dino.w / 2, dino.y + dino.h / 2, '#38bdf8', 7);
    }
    dashJustPressed = false;

    // 3. Movimiento Horizontal, Polvo de Derrape (Skid Dust) y Estelas
    const speedMultiplier = dino.invincibleTimer > 0 ? 1.35 : 1.0;
    const maxSpeed = 4.6 * speedMultiplier;
    const accel = (dino.onGround ? 0.46 : 0.30) * speedMultiplier;

    if (dino.dashTimer > 0) {
      dino.dashTimer -= dt;
      dino.vx = dino.dir * 10.4;
      dino.vy = 0;
      if (Math.floor(dino.dashTimer * 2) % 2 === 0) {
        afterimages.push({ x: dino.x, y: dino.y, dir: dino.dir, color: 'rgba(56, 189, 248, 0.45)', life: 12 });
      }
    } else {
      if (isLeft()) {
        if (dino.onGround && dino.vx > 2.2) {
          // Polvo blanco de derrape al cambiar bruscamente de dirección
          addParticles(dino.x + dino.w, dino.y + dino.h - 2, '#f8fafc', 3);
          SFX.skid();
        }
        dino.vx = Math.max(dino.vx - accel * dt, -maxSpeed);
        dino.dir = -1;
        dino.animFrame += 0.19 * dt * speedMultiplier;
      } else if (isRight()) {
        if (dino.onGround && dino.vx < -2.2) {
          addParticles(dino.x, dino.y + dino.h - 2, '#f8fafc', 3);
          SFX.skid();
        }
        dino.vx = Math.min(dino.vx + accel * dt, maxSpeed);
        dino.dir = 1;
        dino.animFrame += 0.19 * dt * speedMultiplier;
      } else {
        dino.vx *= Math.pow(0.82, dt);
        if (Math.abs(dino.vx) < 0.08) dino.vx = 0;
        dino.animFrame = 0;
      }
    }

    // Estela arcoíris si tiene Bebida Energética Dorada activa
    if (dino.invincibleTimer > 0 && Math.floor(dino.invincibleTimer) % 3 === 0) {
      const rainbowColors = ['rgba(239,68,68,0.45)', 'rgba(251,191,36,0.45)', 'rgba(34,197,94,0.45)', 'rgba(56,189,248,0.45)'];
      const col = rainbowColors[Math.floor(dino.invincibleTimer / 3) % rainbowColors.length];
      afterimages.push({ x: dino.x, y: dino.y, dir: dino.dir, color: col, life: 10 });
    }

    // 4. COYOTE TIME (8 frames) + JUMP BUFFERING (8 frames)
    if (dino.onGround) {
      dino.coyoteTimer = 8;
    } else if (dino.coyoteTimer > 0) {
      dino.coyoteTimer = Math.max(0, dino.coyoteTimer - dt);
    }

    if (jumpJustPressed) {
      dino.jumpBufferTimer = 8;
      jumpJustPressed = false;
    } else if (dino.jumpBufferTimer > 0) {
      dino.jumpBufferTimer = Math.max(0, dino.jumpBufferTimer - dt);
    }

    if (dino.jumpBufferTimer > 0 && dino.coyoteTimer > 0) {
      dino.vy = -11.5;
      dino.onGround = false;
      dino.coyoteTimer = 0;
      dino.jumpBufferTimer = 0;
      dino.dashTimer = 0;
      // Estiramiento elástico de salto (Stretch)
      dino.scaleX = 0.76;
      dino.scaleY = 1.28;
      SFX.jump();
      addParticles(dino.x + dino.w / 2, dino.y + dino.h, '#e2e8f0', 4);
    }

    if (dino.dashTimer <= 0) {
      const gravity = (dino.vy < 0 && !isJump()) ? 1.15 : 0.48;
      dino.vy = Math.min(dino.vy + gravity * dt, 13);
    }

    // 5. Lanzamiento de Sello "APROBADO"
    if (stampJustPressed) {
      if (!dino.senior) {
        SFX.emptyInk();
        addFloatingText('¡TOMA CAFÉ PARA USAR SELLO!', dino.x - 10, dino.y - 10, '#cbd5e1');
      } else if (stamps.length >= 2) {
        SFX.emptyInk();
      } else if (dino.ink <= 0) {
        SFX.emptyInk();
        addFloatingText('¡SIN TINTA!', dino.x, dino.y - 10, '#f87171');
      } else {
        dino.ink--;
        dino.jawOpenTimer = 15;
        SFX.stamp();
        stamps.push({
          x: dino.dir === 1 ? dino.x + dino.w : dino.x - 24,
          y: dino.y + 16, w: 26, h: 15,
          vx: dino.dir * 7.8, vy: -2.6, bounces: 0, life: 62
        });
      }
    }
    stampJustPressed = false;

    // 6. Sillas y Ascensores Móviles
    for (const ch of movingChairs) {
      const prevX = ch.x;
      const prevY = ch.y;
      if (ch.vx !== 0) {
        ch.x += ch.vx * dt;
        if (ch.x < ch.minX) { ch.x = ch.minX; ch.vx *= -1; }
        if (ch.x > ch.maxX) { ch.x = ch.maxX; ch.vx *= -1; }
      }
      if (ch.vy !== 0) {
        ch.y += ch.vy * dt;
        if (ch.y < ch.minY) { ch.y = ch.minY; ch.vy *= -1; }
        if (ch.y > ch.maxY) { ch.y = ch.maxY; ch.vy *= -1; }
      }
      ch.dx = ch.x - prevX;
      ch.dy = ch.y - prevY;
    }

    // 7. Colisiones Eje X y Eje Y con detección de Aterrizaje Elástico (Squash)
    const allSolids = [
      ...platforms,
      ...qBlocks,
      ...warpPipes,
      ...bridgeBlocks.filter(b => !b.falling)
    ];

    const wasOnGround = dino.onGround;
    const prevFootY = dino.y + dino.h;

    dino.x += dino.vx * dt;
    if (dino.x < cameraX) { dino.x = cameraX; dino.vx = 0; }

    const dinoHorizontalBox = { x: dino.x, y: dino.y + 6, w: dino.w, h: dino.h - 12 };
    for (const s of allSolids) {
      if (rectIntersect(dinoHorizontalBox, s)) {
        if (dino.vx > 0) dino.x = s.x - dino.w;
        else if (dino.vx < 0) dino.x = s.x + s.w;
        dino.vx = 0;
        dinoHorizontalBox.x = dino.x;
      }
    }

    dino.y += dino.vy * dt;
    dino.onGround = false;

    for (const s of allSolids) {
      if (rectIntersect(dino, s)) {
        if (dino.vy > 0) {
          if (!wasOnGround && dino.vy > 4.5) {
            // Compresión elástica al aterrizar (Squash)
            dino.scaleX = 1.28;
            dino.scaleY = 0.74;
          }
          dino.y = s.y - dino.h;
          dino.vy = 0;
          dino.onGround = true;

          if (s.targetLvl !== undefined) {
            SFX.warp();
            addFloatingText(`¡WARP ZONE A ${s.label}!`, dino.x - 30, dino.y - 25, '#4ade80');
            gameState = 'WARPING';
            warpSeq = { active: true, targetLvl: s.targetLvl, timer: 26 };
            dino.vx = 0;
            dino.vy = 0;
            return;
          }
        } else if (dino.vy < 0) {
          dino.y = s.y + s.h;
          dino.vy = 0;
          if (s.content) triggerQBlock(s);
        }
      }
    }

    for (const ch of movingChairs) {
      const prevPlatY = ch.y - (ch.dy || 0);
      if (
        dino.vy >= -2 &&
        dino.x + dino.w > ch.x + 4 &&
        dino.x < ch.x + ch.w - 4 &&
        prevFootY <= prevPlatY + 14 &&
        dino.y + dino.h >= ch.y - 4
      ) {
        if (!wasOnGround && dino.vy > 4.5) {
          dino.scaleX = 1.26;
          dino.scaleY = 0.76;
        }
        dino.y = ch.y - dino.h;
        dino.vy = 0;
        dino.onGround = true;
        dino.x += ch.dx || 0;
      }
    }

    if (dino.y > H + 45) {
      lives--;
      SFX.hurt();
      triggerScreenShake(16, 6);
      saveRecords(score, currentLevelIdx, foldersCollectedInLevel);
      if (lives <= 0) {
        showModal('¡CAÍDA DEL SISTEMA!', 'Caíste al vacío. Usa el Coyote Time o el botón ⚡ DASH para cruzar abismos largos.', 'REINTENTAR DESDE 1-1', () => buildLevel(true, true));
      } else {
        buildLevel(false, false);
      }
      return;
    }

    // 8. Hitos de Jornada y Recolección de Carpetas Confidenciales (📁 0/3)
    if (!entryMarked && dino.x >= 280) {
      entryMarked = true;
      SFX.coin();
      score += 200;
      addFloatingText('¡ENTRADA MARCADA 08:00 AM!', dino.x, dino.y - 25, '#4ade80');
    }

    if (!checkpointReached && dino.x >= 1900) {
      checkpointReached = true;
      SFX.powerup();
      dino.ink = dino.maxInk;
      if (!dino.senior) dino.senior = true;
      if (workdayTimer <= LUNCH_DEADLINE_SECS) {
        lunchBonusAwarded = true;
        score += 500;
        bonuses += 5;
        addFloatingText('¡REFRIGERIO 1:00 PM RESPETADO! +$500', dino.x - 40, dino.y - 35, '#fbbf24');
      } else {
        addFloatingText('¡PUNTO DE CONTROL: REFRIGERIO!', dino.x - 20, dino.y - 30, '#38bdf8');
      }
      addParticles(1920, GROUND_Y - 40, '#22c55e', 16);
    }

    for (const fl of folders) {
      if (!fl.collected && rectIntersect(dino, fl)) {
        fl.collected = true;
        foldersCollectedInLevel++;
        SFX.folder();
        score += 400;
        addParticles(fl.x + 14, fl.y + 12, '#fbbf24', 12);
        if (foldersCollectedInLevel === 3) {
          score += 1000;
          unlockAchievement('dinocorp_carpetas');
          addFloatingText('📁 ¡3/3 CARPETAS CONFIDENCIALES! +$1000', dino.x - 50, dino.y - 30, '#fbbf24');
        } else {
          addFloatingText(`📁 CARPETA ${foldersCollectedInLevel}/3 (+$400)`, fl.x - 20, fl.y - 15, '#38bdf8');
        }
        saveRecords(score, currentLevelIdx, foldersCollectedInLevel);
      }
    }

    // 9. Bloques [?] e Ítems (Café, Tóner y Bebida Energética Dorada)
    for (const qb of qBlocks) {
      if (qb.bounce > 0) qb.bounce = Math.max(0, qb.bounce - 0.6 * dt);
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.vy * dt;
      it.vy = Math.min(it.vy + 0.35 * dt, 6);
      for (const s of allSolids) {
        if (rectIntersect(it, s) && it.vy > 0) {
          it.y = s.y - it.h;
          it.vy = 0;
        }
      }
      if (rectIntersect(dino, it)) {
        dino.jawOpenTimer = 16;
        if (it.type === 'coffee') {
          dino.senior = true;
          dino.ink = dino.maxInk;
          score += 300;
          SFX.powerup();
          addFloatingText('¡CAFÉ EXPRESO: DINO SENIOR!', dino.x - 10, dino.y - 20, '#fbbf24');
        } else if (it.type === 'energy') {
          dino.senior = true;
          dino.ink = dino.maxInk;
          dino.invincibleTimer = 480; // 8 segundos de invencibilidad arcoíris
          score += 500;
          SFX.energy();
          triggerScreenShake(10, 4);
          addFloatingText('⚡ ¡BEBIDA ENERGÉTICA: MODO INVENCIBLE!', dino.x - 45, dino.y - 25, '#fde047');
        } else {
          dino.ink = dino.maxInk;
          score += 200;
          SFX.coin();
          addFloatingText('¡TÓNER: 100% TINTA!', dino.x, dino.y - 20, '#4ade80');
        }
        items.splice(i, 1);
      }
    }

    // 10. Sellos Verdes "APROBADO"
    for (let i = stamps.length - 1; i >= 0; i--) {
      const st = stamps[i];
      st.x += st.vx * dt;
      st.y += st.vy * dt;
      st.vy += 0.34 * dt;
      st.life -= dt;
      let removed = false;
      for (const s of allSolids) {
        if (rectIntersect(st, s)) {
          if (st.vy > 0 && st.y + st.h - st.vy * dt <= s.y + 9 && st.bounces < 1) {
            st.y = s.y - st.h;
            st.vy = -5.2;
            st.bounces++;
          } else {
            removed = true;
          }
          break;
        }
      }
      if (st.life <= 0 || removed) stamps.splice(i, 1);
    }

    // 11. Enemigos con Gravedad Vertical Real y Colisión en Modo Invencible
    for (const en of enemies) {
      if (!en.alive) continue;

      en.x += en.vx * dt;
      if (en.minX && en.x < en.minX) { en.x = en.minX; en.vx *= -1; }
      if (en.maxX && en.x + en.w > en.maxX) { en.x = en.maxX - en.w; en.vx *= -1; }

      for (const s of allSolids) {
        if (rectIntersect(en, s)) {
          if (en.vx > 0) en.x = s.x - en.w;
          else en.x = s.x + s.w;
          en.vx *= -1;
        }
      }

      en.vy = Math.min((en.vy || 0) + 0.45 * dt, 10);
      en.y += en.vy * dt;
      for (const s of allSolids) {
        if (rectIntersect(en, s) && en.vy > 0) {
          en.y = s.y - en.h;
          en.vy = 0;
        }
      }

      if (en.y > H + 50) {
        en.alive = false;
        continue;
      }

      if (en.type === 'printer' && en.state === 'sliding') {
        for (const other of enemies) {
          if (other !== en && other.alive && rectIntersect(en, other)) {
            other.alive = false;
            score += 150;
            SFX.stomp();
            triggerScreenShake(8, 4);
            addParticles(other.x + 16, other.y + 16, '#f8fafc', 8);
            addFloatingText('¡BARRIDO +150!', other.x, other.y, '#38bdf8');
          }
        }
      }

      for (let si = stamps.length - 1; si >= 0; si--) {
        const st = stamps[si];
        if (rectIntersect(st, en)) {
          if (en.type === 'printer') {
            st.vx *= -0.7;
            st.vy = -4.5;
            st.life = Math.min(st.life, 18);
            SFX.clink();
            addFloatingText('¡BLINDADA! PÍSALA', en.x - 10, en.y - 12, '#cbd5e1');
          } else {
            en.alive = false;
            stamps.splice(si, 1);
            score += 100;
            SFX.stomp();
            addParticles(en.x + 16, en.y + 16, '#ffffff', 8);
            addFloatingText('¡ARCHIVADO!', en.x, en.y, '#4ade80');
          }
          break;
        }
      }

      if (!en.alive) continue;

      if (rectIntersect(dino, en)) {
        // Si tiene Bebida Energética Dorada activa, destruye cualquier enemigo al contacto
        if (dino.invincibleTimer > 0) {
          en.alive = false;
          score += 200;
          SFX.kick();
          triggerScreenShake(7, 3.5);
          addParticles(en.x + 16, en.y + 16, '#fbbf24', 10);
          addFloatingText('⚡ ¡DESPACHADO +200!', en.x, en.y, '#fde047');
          continue;
        }

        const fallingOnTop = dino.vy > 0 && (prevFootY <= en.y + 16);
        if (fallingOnTop) {
          dino.vy = -8.8;
          dino.scaleX = 0.80;
          dino.scaleY = 1.22;
          SFX.stomp();
          if (en.type === 'paper') {
            en.alive = false;
            score += 100;
            addParticles(en.x + 16, en.y + 16, '#ffffff', 8);
          } else if (en.type === 'printer') {
            if (en.state === 'walk' || en.state === 'sliding') {
              en.state = 'stopped';
              en.vx = 0;
              addFloatingText('¡DETENIDA! PATÉALA', en.x - 10, en.y - 12, '#fbbf24');
            } else {
              en.state = 'sliding';
              en.vx = dino.x < en.x ? 8.5 : -8.5;
              SFX.kick();
            }
          }
        } else if (en.type === 'printer' && en.state === 'stopped') {
          en.state = 'sliding';
          en.vx = dino.x < en.x ? 8.5 : -8.5;
          dino.x += dino.x < en.x ? -6 : 6;
          SFX.kick();
        } else {
          hurtDino('¡CHOCASTE CON PENDIENTE!');
        }
      }
    }

    // 12. Agujas de Fuego Giratorias en Mundo 1-4
    for (const fb of firebars) {
      fb.angle += fb.speed * dt;
      for (let step = 1; step <= 4; step++) {
        const dist = (fb.radius / 4) * step;
        const fx = fb.x + Math.cos(fb.angle) * dist - 6;
        const fy = fb.y + Math.sin(fb.angle) * dist - 6;
        if (rectIntersect({ x: dino.x + 4, y: dino.y + 4, w: dino.w - 8, h: dino.h - 8 }, { x: fx, y: fy, w: 12, h: 12 })) {
          hurtDino('¡RELOJ DE PRESIÓN ARDIENTE!');
          break;
        }
      }
    }

    // 13. Aviones de Auditoría Urgente
    if (dino.x > 1100 && dino.x < lvl.goalX - 450) {
      planeSpawnTimer += dt;
      if (planeSpawnTimer >= 175) {
        planeSpawnTimer = 0;
        const py = Math.random() > 0.5 ? GROUND_Y - 32 : GROUND_Y - 78;
        paperPlanes.push({ x: cameraX + W + 40, y: py, w: 34, h: 16, vx: -5.2 });
      }
    }

    for (let i = paperPlanes.length - 1; i >= 0; i--) {
      const pp = paperPlanes[i];
      pp.x += pp.vx * dt;
      if (rectIntersect(dino, pp)) {
        if (dino.invincibleTimer > 0) {
          score += 150;
          SFX.stomp();
          addParticles(pp.x, pp.y, '#fbbf24', 6);
        } else {
          hurtDino('¡AUDITORÍA URGENTE!');
        }
        paperPlanes.splice(i, 1);
        continue;
      }
      if (pp.x < cameraX - 80) paperPlanes.splice(i, 1);
    }

    // 14. Jefe Final e Interruptor Dorado (Mundo 1-4)
    updateBoss(dt, prevFootY);

    if (goldenSwitch && !goldenSwitch.pressed && rectIntersect(dino, goldenSwitch)) {
      goldenSwitch.pressed = true;
      SFX.powerup();
      triggerScreenShake(22, 7);
      score += 1000;
      addFloatingText('¡INTERRUPTOR 6:00 PM ACTIVADO!', goldenSwitch.x - 90, goldenSwitch.y - 25, '#fbbf24');
      bridgeBlocks.forEach((b, idx) => addLevelTimer(() => { b.falling = true; }, idx * 50));
      if (boss && boss.alive) {
        addLevelTimer(() => {
          if (boss) {
            boss.fallingInPit = true;
            SFX.hurt();
          }
        }, 400);
      }
    }

    for (const b of bridgeBlocks) {
      if (b.falling) {
        b.vy += 0.55 * dt;
        b.y += b.vy * dt;
      }
    }

    // 15. Meta del Nivel
    if (dino.x + dino.w >= lvl.goalX && gameState === 'PLAYING') {
      if (currentLevelIdx === 1 && dino.y + dino.h <= 120) {
        // Sigue caminando sobre el techo hacia los tubos de la Warp Zone
      } else {
        gameState = 'ENDING';
        endingSeq.phase = 1;
        dino.vx = 0;
        dino.vy = 0;
        dino.x = lvl.goalX - 14;
        const heightBonus = Math.max(200, Math.round((GROUND_Y - dino.y) * 5));
        score += heightBonus;
        const remSecs = Math.max(0, Math.ceil(MAX_WORKDAY_SECS - workdayTimer));
        const earnedMedal = awardLevelMedal(currentLevelIdx, foldersCollectedInLevel, remSecs);
        SFX.win();
        addFloatingText(`¡META ${lvl.id} ${earnedMedal}! +$${heightBonus}`, dino.x - 60, dino.y - 20, '#4ade80');
      }
    }

    const targetCam = dino.x - 230;
    if (targetCam > cameraX) {
      cameraX = Math.min(lvl.worldW - W, targetCam);
    }

    for (let i = afterimages.length - 1; i >= 0; i--) {
      afterimages[i].life -= dt;
      if (afterimages[i].life <= 0) afterimages.splice(i, 1);
    }
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.y += ft.vy * dt;
      ft.life -= dt;
      if (ft.life <= 0) floatingTexts.splice(i, 1);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 0.25 * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function triggerQBlock(qb) {
    if (qb.hit) {
      SFX.clink();
      return;
    }
    qb.hit = true;
    qb.bounce = 8;
    if (qb.content === 'coin') {
      SFX.coin();
      score += 100;
      bonuses++;
      addFloatingText('+$100 BONO', qb.x, qb.y - 16, '#fbbf24');
    } else {
      SFX.powerup();
      items.push({ type: qb.content, x: qb.x + 4, y: qb.y - 30, w: 28, h: 28, vy: -4 });
    }
  }

  function updateBoss(dt, prevFootY) {
    if (!boss || !boss.alive) return;
    if (boss.hurtCooldown > 0) boss.hurtCooldown = Math.max(0, boss.hurtCooldown - dt);
    if (boss.fallingInPit) {
      boss.y += 6.5 * dt;
      if (boss.y > H + 80) boss.alive = false;
      return;
    }
    if (dino.x < 3300) return;

    boss.x += boss.vx * dt;
    if (boss.x < 3620) { boss.x = 3620; boss.vx = Math.abs(boss.vx); }
    if (boss.x > 3890) { boss.x = 3890; boss.vx = -Math.abs(boss.vx); }

    boss.y += boss.vy * dt;
    if (boss.y < GROUND_Y - boss.h) {
      boss.vy += 0.42 * dt;
    } else {
      if (boss.vy > 4) {
        boss.shielded = false;
        boss.vulnerableTimer = 140;
        triggerScreenShake(12, 5); // Sacudida de cámara cuando el Gerente aterriza pesadamente
      }
      boss.y = GROUND_Y - boss.h;
      boss.vy = 0;
    }

    if (!boss.shielded) {
      boss.vulnerableTimer -= dt;
      if (boss.vulnerableTimer <= 0) boss.shielded = true;
    }

    boss.actionTimer -= dt;
    if (boss.actionTimer <= 0) {
      boss.actionTimer = 95;
      if (boss.y >= GROUND_Y - boss.h - 2) boss.vy = -10.2;
      const highShot = Math.random() > 0.5;
      boss.projectiles.push({
        x: boss.x - 16,
        y: highShot ? boss.y + 12 : boss.y + 44,
        w: 44, h: 18, vx: -4.5,
        label: highShot ? 'REUNIÓN 5:55' : '¡URGENTE!'
      });
    }

    for (let i = boss.projectiles.length - 1; i >= 0; i--) {
      const pr = boss.projectiles[i];
      pr.x += pr.vx * dt;
      if (rectIntersect(dino, pr)) {
        hurtDino('¡REUNIÓN DE VIERNES 5:55 PM!');
        boss.projectiles.splice(i, 1);
        continue;
      }
      if (pr.x < cameraX - 60) boss.projectiles.splice(i, 1);
    }

    for (let i = stamps.length - 1; i >= 0; i--) {
      const st = stamps[i];
      if (rectIntersect(st, boss)) {
        if (boss.shielded) {
          st.vx = -Math.abs(st.vx) * 0.8;
          st.vy = -4.5;
          SFX.clink();
          addFloatingText('¡ESCUDO ACTIVO! ESPERA QUE SALTE', boss.x - 50, boss.y - 16, '#f87171');
        } else {
          boss.hp--;
          stamps.splice(i, 1);
          SFX.stomp();
          triggerScreenShake(9, 4);
          addFloatingText(`¡APROBADO! (${boss.hp}/${boss.maxHp})`, boss.x, boss.y - 15, '#4ade80');
          if (boss.hp <= 0) {
            boss.alive = false;
            score += 1500;
            SFX.powerup();
          }
        }
        break;
      }
    }

    if (boss.alive && rectIntersect(dino, boss)) {
      const stompTop = dino.vy > 0 && (prevFootY <= boss.y + 18);
      if ((stompTop && !boss.shielded) || dino.invincibleTimer > 0) {
        if (boss.hurtCooldown <= 0) {
          dino.vy = -9.5;
          boss.hp--;
          boss.hurtCooldown = 35;
          SFX.stomp();
          triggerScreenShake(10, 4);
          addFloatingText(`¡IMPACTO! (${Math.max(0, boss.hp)}/${boss.maxHp})`, boss.x, boss.y - 15, '#4ade80');
          if (boss.hp <= 0) { boss.alive = false; score += 1500; SFX.powerup(); }
        }
      } else {
        hurtDino('¡EL JEFE TE ASIGNÓ UN REPORTE!');
      }
    }
  }

  function updateEndingSequence(dt) {
    const lvl = LEVELS[currentLevelIdx];
    if (endingSeq.phase === 1) {
      dino.y = Math.min(GROUND_Y - dino.h, dino.y + 4.2 * dt);
      endingSeq.flagY = Math.min(GROUND_Y - 50, endingSeq.flagY + 4.2 * dt);
      if (dino.y >= GROUND_Y - dino.h) {
        if (!lvl.hasHouse) {
          endingSeq.phase = 3;
          addLevelTimer(() => {
            const nextIdx = currentLevelIdx + 1;
            showModal(
              `✅ ¡NIVEL ${lvl.id} COMPLETADO!`,
              `Superaste ${lvl.name}. Prepárate para el siguiente sector corporativo.`,
              `AVANZAR A MUNDO ${LEVELS[nextIdx].id} (${LEVELS[nextIdx].name})`,
              () => {
                currentLevelIdx = nextIdx;
                buildLevel(false, true);
              }
            );
          }, 500);
        } else {
          endingSeq.phase = 2;
          endingSeq.tieFlying = true;
          endingSeq.tieX = dino.x + 18;
          endingSeq.tieY = dino.y + 20;
          endingSeq.tieVx = -2.2;
          endingSeq.tieVy = -7.5;
          addFloatingText('¡ADIÓS CORBATA, FIN DE JORNADA!', dino.x - 40, dino.y - 30, '#fbbf24');
        }
      }
    } else if (endingSeq.phase === 2) {
      dino.dir = 1;
      dino.x += 2.6 * dt;
      dino.animFrame += 0.16 * dt;
      cameraX = Math.min(lvl.worldW - W, dino.x - 230);

      if (endingSeq.tieFlying) {
        endingSeq.tieX += endingSeq.tieVx * dt;
        endingSeq.tieY += endingSeq.tieVy * dt;
        endingSeq.tieVy += 0.28 * dt;
        endingSeq.tieAngle += 0.25 * dt;
      }

      if (dino.x >= lvl.goalX + 185) {
        dino.visible = false;
        endingSeq.houseLightOn = true;
        endingSeq.phase = 3;
        unlockAchievement('dinocorp_casa');
        SFX.win();
        addLevelTimer(() => {
          gameState = 'VICTORY';
          showModal(
            '🏠 ¡LLEGASTE A CASA A TIEMPO!',
            'Completaste los 4 mundos de DinoCorp v4.2 Deluxe, derrotaste al Gerente de las 5:55 PM y ya estás descansando en casa.',
            'JUGAR NUEVA CAMPAÑA',
            () => buildLevel(true, true),
            true
          );
        }, 850);
      }
    }
  }

  // ==========================================
  // 7. RENDERIZADO MULTICAPA CON PARALLAX Y T-REX EXPRESIVO
  // ==========================================
  function drawParallaxLayers(lvl) {
    // CAPA 1 (0.15x cameraX): Horizonte lejano, nubes o estrellas
    const p1 = -(cameraX * 0.15) % 800;
    for (let ox = p1; ox < W; ox += 800) {
      if (lvl.theme === 'office' || lvl.theme === 'athletic') {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.fillRect(ox + 90, 65, 85, 22);
        ctx.fillRect(ox + 310, 48, 110, 26);
        ctx.fillRect(ox + 580, 72, 95, 22);
      } else {
        ctx.fillStyle = 'rgba(148, 163, 184, 0.25)';
        for (let i = 0; i < 8; i++) {
          ctx.fillRect(ox + i * 95 + 30, 55 + (i % 3) * 28, 4, 4);
        }
      }
    }

    // CAPA 2 (0.40x cameraX): Siluetas de rascacielos / Racks de servidores / Pilares
    const p2 = -(cameraX * 0.40) % 600;
    for (let ox = p2; ox < W; ox += 600) {
      if (lvl.theme === 'office' || lvl.theme === 'athletic') {
        ctx.fillStyle = lvl.theme === 'athletic' ? 'rgba(30, 41, 59, 0.45)' : 'rgba(51, 65, 85, 0.28)';
        ctx.fillRect(ox + 40, 170, 95, 220);
        ctx.fillRect(ox + 180, 130, 115, 260);
        ctx.fillRect(ox + 360, 155, 105, 235);
      } else if (lvl.theme === 'underground') {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
        ctx.fillRect(ox + 60, 140, 70, 250);
        ctx.fillRect(ox + 280, 140, 70, 250);
        ctx.fillRect(ox + 460, 140, 70, 250);
      } else {
        ctx.fillStyle = 'rgba(69, 10, 10, 0.55)';
        ctx.fillRect(ox + 80, 90, 55, 300);
        ctx.fillRect(ox + 340, 90, 55, 300);
      }
    }
  }

  function draw() {
    const lvl = LEVELS[currentLevelIdx];
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H);

    if (lvl.theme === 'office') {
      skyGrad.addColorStop(0, '#38bdf8');
      skyGrad.addColorStop(1, '#bae6fd');
    } else if (lvl.theme === 'underground') {
      skyGrad.addColorStop(0, '#090d16');
      skyGrad.addColorStop(1, '#1e293b');
    } else if (lvl.theme === 'athletic') {
      skyGrad.addColorStop(0, '#0284c7');
      skyGrad.addColorStop(0.6, '#f97316');
      skyGrad.addColorStop(1, '#fde047');
    } else {
      skyGrad.addColorStop(0, '#18181b');
      skyGrad.addColorStop(0.7, '#450a0a');
      skyGrad.addColorStop(1, '#991b1b');
    }
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    // Dibujar Capas Parallax de Fondo
    drawParallaxLayers(lvl);

    // Partículas ambientales sutiles por sector
    const ambColor = lvl.theme === 'underground' ? '56, 189, 248'
      : (lvl.theme === 'castle' ? '249, 115, 22' : '255, 255, 255');
    for (const ap of ambientParticles) {
      ctx.fillStyle = `rgba(${ambColor}, ${ap.alpha})`;
      ctx.fillRect(ap.x, ap.y, ap.size, ap.size);
    }

    ctx.save();
    // Aplicar Screen Shake si está activo
    const shakeX = shakeTimer > 0 ? (Math.random() - 0.5) * shakeIntensity * 2 : 0;
    const shakeY = shakeTimer > 0 ? (Math.random() - 0.5) * shakeIntensity * 2 : 0;
    ctx.translate(-Math.floor(cameraX) + shakeX, shakeY);

    if (lvl.theme === 'office') {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(820, 55, 2900, GROUND_Y - 55);
      for (let wx = 900; wx < 3600; wx += 220) {
        ctx.fillStyle = '#7dd3fc';
        ctx.fillRect(wx, 95, 130, 110);
      }
    } else if (lvl.theme === 'underground') {
      for (let rx = 200; rx < 3400; rx += 260) {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(rx, 145, 75, 245);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(rx + 12, 165, 8, 4);
        ctx.fillRect(rx + 12, 185, 8, 4);
      }
    }

    drawBiometricGate(280, GROUND_Y - 120, 'ENTRADA 08:00 AM', entryMarked ? '#22c55e' : '#f59e0b');
    drawLunchZone(1880, GROUND_Y);

    for (const p of platforms) {
      if (p.type === 'ground') {
        ctx.fillStyle = lvl.theme === 'underground' ? '#1e3a8a' : (lvl.theme === 'castle' ? '#3f3f46' : '#334155');
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = lvl.theme === 'castle' ? '#ef4444' : '#64748b';
        ctx.fillRect(p.x, p.y, p.w, 8);
      } else if (p.type === 'ceiling') {
        ctx.fillStyle = '#1d4ed8';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeStyle = '#93c5fd';
        ctx.strokeRect(p.x, p.y, p.w, p.h);
      } else if (p.type === 'cabinet') {
        ctx.fillStyle = '#475569';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeStyle = '#1e293b';
        ctx.strokeRect(p.x, p.y, p.w, p.h);
      } else if (p.type === 'desk') {
        ctx.fillStyle = '#b45309';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(p.x, p.y, p.w, 5);
      } else {
        ctx.fillStyle = '#64748b';
        ctx.fillRect(p.x, p.y, p.w, p.h);
      }
    }

    for (const wp of warpPipes) {
      ctx.fillStyle = '#16a34a';
      ctx.fillRect(wp.x, wp.y, wp.w, wp.h);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(wp.x - 4, wp.y, wp.w + 8, 16);
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText(wp.label, wp.x - 8, wp.y - 10);
    }

    for (const b of bridgeBlocks) {
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(b.x, b.y, b.w - 2, b.h);
    }

    if (goldenSwitch) {
      ctx.fillStyle = goldenSwitch.pressed ? '#16a34a' : '#fbbf24';
      ctx.fillRect(goldenSwitch.x, goldenSwitch.y, goldenSwitch.w, goldenSwitch.h);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px sans-serif';
      ctx.fillText('6:00 PM', goldenSwitch.x - 3, goldenSwitch.y - 6);
    }

    for (const ch of movingChairs) {
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(ch.x, ch.y, ch.w, ch.h);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(ch.x + 4, ch.y + 2, ch.w - 8, 5);
    }

    for (const qb of qBlocks) {
      const by = qb.y - qb.bounce;
      ctx.fillStyle = qb.hit ? '#64748b' : (qb.golden ? '#facc15' : '#f59e0b');
      ctx.fillRect(qb.x, by, qb.w, qb.h);
      if (qb.golden && !qb.hit) {
        ctx.strokeStyle = '#fef08a';
        ctx.lineWidth = 2;
        ctx.strokeRect(qb.x, by, qb.w, qb.h);
      }
      if (!qb.hit) {
        ctx.fillStyle = qb.golden ? '#090d16' : '#fff';
        ctx.font = 'bold 20px monospace';
        ctx.fillText(qb.golden ? '!' : '?', qb.x + 11, by + 25);
      }
    }

    // Carpetas Confidenciales Doradas (📁)
    for (const fl of folders) {
      if (fl.collected) continue;
      const floatY = Math.sin(performance.now() * 0.005 + fl.x) * 3;
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(fl.x, fl.y + floatY + 4, fl.w, fl.h - 4);
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(fl.x, fl.y + floatY, 12, 5);
      ctx.strokeStyle = '#fef08a';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(fl.x, fl.y + floatY + 4, fl.w, fl.h - 4);
      ctx.fillStyle = '#78350f';
      ctx.font = 'bold 8px sans-serif';
      ctx.fillText('TOP', fl.x + 5, fl.y + floatY + 17);
    }

    for (const it of items) {
      ctx.fillStyle = it.type === 'coffee' ? '#ffffff' : (it.type === 'energy' ? '#facc15' : '#16a34a');
      ctx.fillRect(it.x + 2, it.y + 4, 24, 22);
      ctx.fillStyle = it.type === 'coffee' ? '#78350f' : (it.type === 'energy' ? '#090d16' : '#ffffff');
      ctx.font = 'bold 8px sans-serif';
      const label = it.type === 'coffee' ? 'CAFÉ' : (it.type === 'energy' ? '⚡MAX' : 'INK');
      ctx.fillText(label, it.x + 3, it.y + 18);
    }

    for (const fb of firebars) {
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(fb.x, fb.y, 7, 0, Math.PI * 2);
      ctx.fill();
      for (let step = 1; step <= 4; step++) {
        const dist = (fb.radius / 4) * step;
        const fx = fb.x + Math.cos(fb.angle) * dist;
        const fy = fb.y + Math.sin(fb.angle) * dist;
        ctx.fillStyle = step % 2 === 0 ? '#ef4444' : '#f97316';
        ctx.beginPath();
        ctx.arc(fx, fy, 7, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (const en of enemies) {
      if (!en.alive) continue;
      if (en.type === 'paper') {
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(en.x, en.y, en.w, en.h);
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(en.x + 6, en.y + 10, 5, 5);
        ctx.fillRect(en.x + 20, en.y + 10, 5, 5);
      } else {
        ctx.fillStyle = en.state === 'stopped' ? '#fbbf24' : '#64748b';
        ctx.fillRect(en.x, en.y + 6, en.w, en.h - 6);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(en.x + 5, en.y + 12, en.w - 10, 10);
      }
    }

    for (const pp of paperPlanes) {
      ctx.fillStyle = '#fca5a5';
      ctx.fillRect(pp.x, pp.y, pp.w, pp.h);
      ctx.fillStyle = '#ef4444';
      ctx.font = 'bold 9px sans-serif';
      ctx.fillText('AUDITORÍA', pp.x - 4, pp.y - 3);
    }

    if (boss && boss.alive) drawBoss();

    for (const st of stamps) {
      ctx.fillStyle = '#16a34a';
      ctx.fillRect(st.x, st.y, st.w, st.h);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 8px sans-serif';
      ctx.fillText('OK', st.x + 6, st.y + 11);
    }

    drawExitAndHouse(lvl.goalX, lvl.hasHouse);

    if (endingSeq.tieFlying) {
      ctx.save();
      ctx.translate(endingSeq.tieX, endingSeq.tieY);
      ctx.rotate(endingSeq.tieAngle);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(-3, -10, 6, 20);
      ctx.restore();
    }

    // Estelas de Dash y Bebida Energética
    for (const ai of afterimages) {
      ctx.fillStyle = ai.color;
      ctx.fillRect(ai.x, ai.y, dino.w, dino.h);
    }

    if (dino.visible) drawDino();

    // Capa de Diagnóstico (Hitboxes, Vectores y Coyote Time)
    if (debugMode) {
      ctx.strokeStyle = '#00ff00';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(dino.x, dino.y, dino.w, dino.h);
      ctx.beginPath();
      ctx.moveTo(dino.x + dino.w / 2, dino.y + dino.h / 2);
      ctx.lineTo(dino.x + dino.w / 2 + dino.vx * 8, dino.y + dino.h / 2 + dino.vy * 5);
      ctx.stroke();

      ctx.strokeStyle = '#ff0055';
      for (const en of enemies) {
        if (en.alive) ctx.strokeRect(en.x, en.y, en.w, en.h);
      }
      ctx.strokeStyle = '#38bdf8';
      for (const ch of movingChairs) {
        ctx.strokeRect(ch.x, ch.y, ch.w, ch.h);
      }
    }

    for (const p of particles) {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    for (const ft of floatingTexts) {
      ctx.fillStyle = ft.color;
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText(ft.text, ft.x, ft.y);
    }

    ctx.restore();
    drawHUD();
  }

  function drawBiometricGate(x, y, label, color) {
    ctx.fillStyle = '#334155';
    ctx.fillRect(x, y, 12, 120);
    ctx.fillRect(x + 74, y, 12, 120);
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(x - 10, y - 24, 108, 26);
    ctx.strokeStyle = color;
    ctx.strokeRect(x - 10, y - 24, 108, 26);
    ctx.fillStyle = color;
    ctx.font = 'bold 10px sans-serif';
    ctx.fillText(label, x - 4, y - 7);
  }

  function drawLunchZone(x, groundY) {
    ctx.fillStyle = '#065f46';
    ctx.fillRect(x, groundY - 110, 128, 22);
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 10px sans-serif';
    ctx.fillText('☕ REFRIGERIO 1:00 PM', x + 6, groundY - 95);
    ctx.fillStyle = '#78350f';
    ctx.fillRect(x + 10, groundY - 88, 7, 88);
    ctx.fillRect(x + 110, groundY - 88, 7, 88);
  }

  function drawBoss() {
    if (boss.shielded) {
      ctx.strokeStyle = 'rgba(239, 68, 68, 0.9)';
      ctx.lineWidth = 3;
      ctx.strokeRect(boss.x - 6, boss.y - 6, boss.w + 12, boss.h + 12);
    }
    ctx.fillStyle = '#1e1b4b';
    ctx.fillRect(boss.x, boss.y + 18, boss.w, boss.h - 18);
    ctx.fillStyle = '#fca5a5';
    ctx.fillRect(boss.x + 10, boss.y, boss.w - 20, 24);
    ctx.fillStyle = '#fbbf24';
    ctx.fillRect(boss.x + 26, boss.y + 26, 10, 28);

    ctx.font = 'bold 10px sans-serif';
    ctx.fillStyle = boss.shielded ? '#fca5a5' : '#4ade80';
    ctx.fillText(boss.shielded ? '🛡️ EN REUNIÓN (INMUNE)' : '💦 ¡VULNERABLE! ATACA', boss.x - 28, boss.y - 10);

    // Barra de vida segmentada del Jefe 5:55 PM
    const hpW = 72;
    const hpX = boss.x + boss.w / 2 - hpW / 2;
    const hpY = boss.y - 32;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
    ctx.fillRect(hpX - 2, hpY - 2, hpW + 4, 10);
    for (let i = 0; i < boss.maxHp; i++) {
      ctx.fillStyle = i < boss.hp ? '#ef4444' : '#334155';
      ctx.fillRect(hpX + i * (hpW / boss.maxHp) + 1, hpY, (hpW / boss.maxHp) - 2, 6);
    }
    ctx.fillStyle = '#fef2f2';
    ctx.font = 'bold 9px sans-serif';
    ctx.fillText('GERENTE 5:55 PM', hpX - 4, hpY - 4);

    for (const pr of boss.projectiles) {
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(pr.x, pr.y, pr.w, pr.h);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 8px sans-serif';
      ctx.fillText(pr.label, pr.x + 3, pr.y + 12);
    }
  }

  function drawExitAndHouse(goalX, hasHouse) {
    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(goalX, 110, 6, GROUND_Y - 110);
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(goalX + 6, endingSeq.flagY, 62, 30);
    ctx.fillStyle = '#052e16';
    ctx.font = 'bold 10px sans-serif';
    ctx.fillText('6:00 PM', goalX + 14, endingSeq.flagY + 19);

    if (hasHouse) {
      const hx = goalX + 150;
      const hy = GROUND_Y - 125;
      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(hx, hy + 35, 130, 90);
      ctx.fillStyle = '#b91c1c';
      ctx.beginPath();
      ctx.moveTo(hx - 14, hy + 35);
      ctx.lineTo(hx + 65, hy - 15);
      ctx.lineTo(hx + 144, hy + 35);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#78350f';
      ctx.fillRect(hx + 22, hy + 68, 34, 57);
      ctx.fillStyle = endingSeq.houseLightOn ? '#fde047' : '#334155';
      ctx.fillRect(hx + 74, hy + 62, 38, 36);
    }
  }

  function drawDino() {
    if (dino.invulnerable > 0 && Math.floor(dino.invulnerable / 4) % 2 === 1) return;
    ctx.save();
    // Anclar Squash & Stretch desde la base de los pies del Dino
    ctx.translate(dino.x + dino.w / 2, dino.y + dino.h);
    ctx.scale(dino.dir * dino.scaleX, dino.scaleY);
    ctx.translate(0, -dino.h / 2);

    const x = -dino.w / 2;
    const y = -dino.h / 2;

    // Aura arcoíris si tiene Bebida Energética Dorada activa
    if (dino.invincibleTimer > 0) {
      const auraColors = ['#ef4444', '#fbbf24', '#22c55e', '#38bdf8', '#a855f7'];
      ctx.strokeStyle = auraColors[Math.floor(performance.now() / 60) % auraColors.length];
      ctx.lineWidth = 3;
      ctx.strokeRect(x - 4, y - 4, dino.w + 8, dino.h + 8);
    } else if (dino.dashFlashTimer > 0) {
      ctx.strokeStyle = `rgba(56, 189, 248, ${dino.dashFlashTimer / 18})`;
      ctx.lineWidth = 2.5;
      ctx.strokeRect(x - 3, y - 3, dino.w + 6, dino.h + 6);
    }

    ctx.fillStyle = '#16a34a';
    ctx.fillRect(x - 8, y + 24, 10, 10);
    ctx.fillStyle = dino.senior ? '#0f172a' : '#f8fafc';
    ctx.fillRect(x + 4, y + 18, 24, 20);
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(x + 6, y, 26, 16);

    // Mandíbula expresiva (se abre al lanzar sello, hacer Dash o festejar)
    const jawDrop = dino.jawOpenTimer > 0 || endingSeq.tieFlying ? 3 : 0;
    ctx.fillStyle = '#15803d';
    ctx.fillRect(x + 16, y + 14 + jawDrop, 16, 4);

    if (dino.senior) {
      ctx.fillStyle = '#000';
      ctx.fillRect(x + 17, y + 4, 14, 6);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(x + 23, y + 5, 5, 3);
    } else {
      ctx.fillStyle = '#000';
      ctx.fillRect(x + 21, y + 4, 4, 4);
    }

    if (!endingSeq.tieFlying) {
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(x + 17, y + 19, 6, 14);
    }

    // Gotas de sudor si quedan menos de 30 segundos en el reloj
    const remSecs = MAX_WORKDAY_SECS - workdayTimer;
    if (remSecs < 30 && gameState === 'PLAYING' && Math.floor(performance.now() / 200) % 2 === 0) {
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(x + 2, y + 2, 3, 6);
    }

    const legLift = dino.onGround ? Math.sin(dino.animFrame * 2) * 3.5 : -3;
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(x + 7, y + 38, 7, 8 + legLift);
    ctx.fillRect(x + 18, y + 38, 7, 8 - legLift);
    ctx.restore();
  }

  function drawHUD() {
    const lvl = LEVELS[currentLevelIdx];
    ctx.fillStyle = 'rgba(15, 23, 42, 0.90)';
    ctx.fillRect(10, 8, W - 20, 40);
    ctx.strokeStyle = dino.invincibleTimer > 0 ? '#fbbf24' : '#334155';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(10, 8, W - 20, 40);

    const remainingSecs = Math.max(0, Math.ceil(MAX_WORKDAY_SECS - workdayTimer));
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText(`🏢 ${lvl.id} ${lvl.name}`, 16, 32);

    ctx.fillStyle = remainingSecs < 30 ? '#ef4444' : '#38bdf8';
    ctx.fillText(`⏳ ${remainingSecs}s`, 182, 32);

    ctx.fillStyle = '#e2e8f0';
    ctx.fillText('TINTA:', 236, 32);
    for (let i = 0; i < dino.maxInk; i++) {
      ctx.fillStyle = i < dino.ink ? '#22c55e' : '#334155';
      ctx.fillRect(280 + i * 12, 20, 9, 14);
    }

    // Carpetas Confidenciales del Nivel (📁 0/3)
    ctx.fillStyle = '#fde047';
    ctx.fillText(`📁 ${foldersCollectedInLevel}/3`, 352, 32);

    // Estado Dash / Invencible / Rango
    if (dino.invincibleTimer > 0) {
      ctx.fillStyle = '#facc15';
      ctx.fillText(`⚡ MAX ${(dino.invincibleTimer / 60).toFixed(1)}s`, 408, 32);
    } else {
      ctx.fillStyle = dino.dashCooldown <= 0 ? '#38bdf8' : '#64748b';
      ctx.fillText(dino.dashCooldown <= 0 ? '⚡ DASH OK' : '⚡ ...', 408, 32);
    }

    ctx.fillStyle = '#fbbf24';
    ctx.fillText(`💰 $${score.toLocaleString('en-US')}`, 492, 32);
    ctx.fillStyle = '#94a3b8';
    ctx.fillText(`🏆 $${Math.max(score, saveData.highScore).toLocaleString('en-US')}`, 594, 32);
    ctx.fillStyle = '#f87171';
    ctx.fillText(`❤️ x${lives}`, 714, 32);

    if (debugMode) {
      ctx.fillStyle = '#4ade80';
      ctx.font = 'bold 10px monospace';
      ctx.fillText(`${Math.round(fpsTracker)}FPS | Coy:${Math.round(dino.coyoteTimer)} Buf:${Math.round(dino.jumpBufferTimer)}`, 630, 62);
    }
  }

  // ==========================================
  // 8. MODALES, RÉCORDS Y EXPORTADOR GOOGLE SITES
  // ==========================================
  const overlayModal = document.getElementById('overlay-modal');
  const modalTitle = document.getElementById('modal-title');
  const modalDesc = document.getElementById('modal-desc');
  const modalStats = document.getElementById('modal-stats');
  const btnModalShare = document.getElementById('btn-modal-share');
  const btnModalAction = document.getElementById('btn-modal-action');

  function generateDinoShareCard() {
    const sc = document.createElement('canvas');
    sc.width = 1200; sc.height = 628;
    const c = sc.getContext('2d');
    const grad = c.createLinearGradient(0, 0, 1200, 628);
    grad.addColorStop(0, '#020617');
    grad.addColorStop(0.5, '#064e3b');
    grad.addColorStop(1, '#0284c7');
    c.fillStyle = grad; c.fillRect(0, 0, 1200, 628);

    c.strokeStyle = '#22c55e'; c.lineWidth = 6; c.strokeRect(40, 40, 1120, 548);
    c.fillStyle = 'rgba(15, 23, 42, 0.94)'; c.fillRect(60, 60, 1080, 508);

    c.fillStyle = '#4ade80'; c.font = 'bold 42px Inter, sans-serif';
    c.fillText('DINOCORP v4.2: ¡SALIDA A TIEMPO!', 100, 145);
    c.fillStyle = '#94a3b8'; c.font = '24px Inter, sans-serif';
    c.fillText('Misión Completada · Arcade Hub (ramses-cn.github.io/Linkedin)', 100, 195);

    c.fillStyle = '#1e293b'; c.fillRect(100, 235, 680, 235);
    c.strokeStyle = '#334155'; c.lineWidth = 2; c.strokeRect(100, 235, 680, 235);
    c.fillStyle = '#fbbf24'; c.font = 'bold 28px Inter, sans-serif';
    c.fillText(`• PUNTAJE DE JORNADA: $${score.toLocaleString('en-US')}`, 135, 300);
    c.fillStyle = '#34d399';
    c.fillText(`• RÉCORD HISTÓRICO: $${Math.max(score, saveData.highScore).toLocaleString('en-US')}`, 135, 355);
    c.fillStyle = '#38bdf8';
    c.fillText(`• CARPETAS TOTALES: ${getTotalSavedFolders()}/12`, 135, 410);

    c.font = '120px sans-serif';
    c.fillText('🦖🏠', 845, 385);
    c.fillStyle = '#64748b'; c.font = '18px Inter, sans-serif';
    c.fillText('#DinoCorp #SalidaATiempo #WebGames #ArcadeHub', 100, 525);

    sc.toBlob((blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.download = 'dinocorp-victoria-linkedin.png';
      a.href = url;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');
  }

  btnModalShare.addEventListener('click', generateDinoShareCard);

  let modalIsPause = false;
  let prevStateBeforeSites = 'PLAYING';

  function showModal(title, desc, btnText, callback, showShare = false, isPause = false) {
    clearInputs();
    saveRecords(score, currentLevelIdx, foldersCollectedInLevel);
    gameState = 'PAUSED';
    modalIsPause = isPause;
    modalTitle.textContent = title;
    modalDesc.textContent = desc;
    const medalsStr = [0, 1, 2, 3].map(i => `${LEVELS[i].id}:${saveData.medalsPerLevel[i] || '—'}`).join(' · ');
    modalStats.innerHTML = `
      <div class="stats-row"><span>Nivel Actual:</span><span>${LEVELS[currentLevelIdx].id} - ${LEVELS[currentLevelIdx].name}</span></div>
      <div class="stats-row"><span>Medallas por Sector:</span><span>${medalsStr}</span></div>
      <div class="stats-row"><span>Carpetas Confidenciales (Nivel / Total):</span><span>📁 ${foldersCollectedInLevel}/3 (Total: ${getTotalSavedFolders()}/12)</span></div>
      <div class="stats-row"><span>Refrigerio Respetado (1:00 PM):</span><span>${lunchBonusAwarded ? '✅ Sí (+$500)' : 'En curso'}</span></div>
      <div class="stats-row"><span>Récord Histórico (High Score):</span><span>🏆 $${saveData.highScore.toLocaleString('en-US')}</span></div>
      <div class="stats-row"><span>Puntaje de Jornada Actual:</span><span>💰 $${score.toLocaleString('en-US')}</span></div>
    `;
    btnModalShare.style.display = showShare ? 'block' : 'none';
    btnModalAction.textContent = btnText;
    btnModalAction.onclick = () => {
      modalIsPause = false;
      overlayModal.classList.remove('visible');
      gameState = 'PLAYING';
      if (callback) callback();
      canvas.focus();
    };
    overlayModal.classList.add('visible');
  }

  function togglePause() {
    if (gameState === 'ENDING' || gameState === 'VICTORY' || gameState === 'WARPING') return;
    if (gameState === 'PLAYING') {
      showModal(
        '☕ JORNADA EN PAUSA (v4.2 DELUXE)',
        'Controles: Flechas/WASD para moverte, Espacio para Salto (con Coyote Time), X/Shift para Sello, y C/Z para Dash Ejecutivo (⚡). Compatible con mandos USB/Bluetooth.',
        'CONTINUAR JORNADA',
        null,
        false,
        true
      );
    } else if (gameState === 'PAUSED' && modalIsPause) {
      modalIsPause = false;
      overlayModal.classList.remove('visible');
      gameState = 'PLAYING';
      canvas.focus();
    }
  }

  // Botones de la Barra Superior
  document.getElementById('btn-debug').addEventListener('click', (e) => {
    debugMode = !debugMode;
    e.currentTarget.classList.toggle('active-mode', debugMode);
  });

  document.getElementById('btn-sim-mobile').addEventListener('click', (e) => {
    const ws = document.getElementById('app-workspace');
    ws.classList.toggle('simulated-mobile-frame');
    e.currentTarget.classList.toggle('active-mode', ws.classList.contains('simulated-mobile-frame'));
    setTimeout(fitCanvas, 50);
  });

  document.getElementById('btn-music').addEventListener('click', (e) => {
    initAudio();
    musicEnabled = !musicEnabled;
    saveAudioPrefs();
    e.currentTarget.textContent = musicEnabled ? '🎵 Música' : '🎵 Off';
    e.currentTarget.classList.toggle('active-mode', musicEnabled);
  });

  document.getElementById('btn-mute').addEventListener('click', (e) => {
    initAudio();
    sfxMuted = !sfxMuted;
    saveAudioPrefs();
    e.currentTarget.textContent = sfxMuted ? '🔇 SFX Off' : '🔊 SFX';
    e.currentTarget.classList.toggle('active-mode', !sfxMuted);
  });

  document.getElementById('btn-pause').addEventListener('click', togglePause);

  // Exportador a Google Sites
  const sitesModal = document.getElementById('sites-modal');
  const sitesCodeBox = document.getElementById('sites-code-box');
  document.getElementById('btn-sites').addEventListener('click', () => {
    clearInputs();
    prevStateBeforeSites = gameState;
    gameState = 'PAUSED';
    sitesCodeBox.value = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    sitesModal.classList.add('visible');
  });
  document.getElementById('btn-copy-sites').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    let copied = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(sitesCodeBox.value);
        copied = true;
      }
    } catch (err) {}
    if (!copied) {
      try {
        sitesCodeBox.select();
        copied = document.execCommand('copy');
      } catch (err) {}
    }
    btn.textContent = copied ? '✅ ¡Código Copiado!' : '⚠️ Selecciona y Ctrl+C';
    setTimeout(() => { btn.textContent = '📋 Copiar Código'; }, 2000);
  });
  document.getElementById('btn-close-sites').addEventListener('click', () => {
    sitesModal.classList.remove('visible');
    gameState = overlayModal.classList.contains('visible') ? 'PAUSED' : prevStateBeforeSites;
    if (gameState === 'PLAYING') canvas.focus();
  });

  // ==========================================
  // 9. BUCLE PRINCIPAL CON DELTA-TIME (60Hz / 120Hz)
  // ==========================================
  window.onload = () => {
    fitCanvas();
    buildLevel(true, true);
    draw();
    showModal(
      '🦖 DINOCORP v4.2 DELUXE',
      'Llega a casa antes de las 6:00 PM. Usa Flechas/WASD, Espacio para Saltar, X/Shift para Sello y C/Z para Dash Ejecutivo (⚡).',
      '▶ INICIAR JORNADA',
      () => { initAudio(); }
    );

    let lastTime = performance.now();
    function gameLoop(now) {
      const elapsedMs = Math.max(1, now - lastTime);
      lastTime = now;
      fpsTracker = fpsTracker * 0.9 + (1000 / elapsedMs) * 0.1;
      const dt = Math.min(Math.max(elapsedMs / 16.6667, 0.1), 2.5);

      update(dt);
      draw();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  };
})();
</script>
</body>
</html>
